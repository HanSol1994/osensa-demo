# Fly.io config for the kitchen service.
#
# Note what is absent: there is no [http_service] and no exposed port. The kitchen
# is an MQTT client that dials out to the broker, so it needs no inbound
# networking. That also means Fly's HTTP health checks do not apply — liveness is
# visible in the logs (`broker_connected`) and, to clients, in the retained
# kitchen status topic backed by the MQTT Last Will.

app = "osensa-restaurant-kitchen"
primary_region = "ams"  # close to the eu HiveMQ cluster; keeps round trips short

[build]
  dockerfile = "Dockerfile"

# Non-secret configuration. Anything identifying or authenticating the broker is
# set with `fly secrets set` instead, so it stays out of the repository.
[env]
  RESTAURANT_BROKER_PORT = "8884"
  RESTAURANT_BROKER_TRANSPORT = "websockets"
  RESTAURANT_BROKER_WS_PATH = "/mqtt"
  RESTAURANT_BROKER_USE_TLS = "true"

  RESTAURANT_TABLE_COUNT = "4"
  RESTAURANT_COOK_MIN_SECONDS = "10"
  RESTAURANT_COOK_MAX_SECONDS = "30"

  RESTAURANT_LOG_FORMAT = "json"
  RESTAURANT_LOG_LEVEL = "INFO"
  RESTAURANT_LOG_STATE_SNAPSHOTS = "true"

  # Demo affordance. Turn off if this is ever pointed at something that matters.
  RESTAURANT_ENABLE_RESET = "true"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

# Exactly one machine. Two kitchens on the same broker would both consume the
# order topic and each order would be cooked twice — the in-memory store means
# there is no shared state to coordinate through. Horizontal scaling would need
# MQTT shared subscriptions plus the persistence work in docs/FUTURE-WORK.md.
[deploy]
  strategy = "immediate"
