# DEVELOPMENT ONLY - anonymous access, no ACLs, no TLS.
#
# Used by docker-compose so `docker compose up` works with no setup step. The
# authenticated configuration a real deployment needs is deploy/mosquitto.conf;
# this file exists purely so a reviewer can run the project in one command without
# first generating a password file.
#
# Never expose this to a network you do not control.

per_listener_settings false

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence false

log_dest stdout
log_type notice
log_type warning
log_type error
connection_messages true
