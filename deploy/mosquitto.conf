# Mosquitto, configured the way a real deployment should be: no anonymous access,
# per-identity ACLs, and a WebSocket listener because browsers cannot speak raw
# MQTT over TCP.
#
# This is the self-hosted equivalent of the managed HiveMQ Cloud setup used for the
# demo. It is committed because the ACL is the single most important security
# control in this system (docs/SECURITY.md §2) and it should be reviewable, not
# buried in a cloud console.
#
# For the zero-setup local path use `python -m tools.dev_broker` instead; for a
# one-command Docker path use deploy/mosquitto.dev.conf via docker-compose.

# Apply the auth settings below to every listener rather than per-listener.
per_listener_settings false

# MQTT over TCP. Useful for a co-located backend and for mosquitto_sub debugging.
listener 1883
protocol mqtt

# MQTT over WebSockets. Required for the browser.
listener 9001
protocol websockets

# --- Authentication -----------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl

# Create the password file with (note -c only on the first user, it truncates):
#   mosquitto_passwd -c /mosquitto/config/mosquitto.passwd kitchen
#   mosquitto_passwd    /mosquitto/config/mosquitto.passwd web-client
# It is deliberately NOT committed.

# --- TLS ----------------------------------------------------------------------
# A public deployment must serve wss:// only — plain ws:// sends the broker
# password and every order in cleartext. Terminate TLS here or at a reverse proxy.
#
# listener 8884
# protocol websockets
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem

# --- Durability ---------------------------------------------------------------
# Off, matching the in-memory backend: the assignment does not require state to
# survive a restart. Note the consequence — retained messages are lost on broker
# restart, so a client sees nothing until the kitchen republishes, which it does on
# every reconnect.
persistence false

# --- Limits (see docs/SECURITY.md §5) -----------------------------------------
max_connections 200
# Orders cap foodName at 80 characters, so 4 KiB is generous. Bounding this stops
# a client exhausting broker memory with oversized publishes.
message_size_limit 4096

# --- Logging ------------------------------------------------------------------
log_dest stdout
log_type notice
log_type warning
log_type error
connection_messages true
