name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete. Cancelling
# avoids two deploys racing to publish different commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tools tests

      - name: Format
        run: ruff format --check src tools tests

      - name: Types
        run: mypy

      # The integration tests start a real MQTT broker in-process, so there are no
      # service containers to configure and nothing external to be flaky.
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` not `install`: fails on a lockfile mismatch rather than silently
      # resolving different versions than a developer has.
      - name: Install
        run: npm ci

      - name: Types
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Advisory only. A new CVE in a transitive dependency should be visible
      # without blocking an unrelated change from shipping.
      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy-backend:
    name: Deploy kitchen to Fly.io
    # Both halves gate both deploys. They share a wire contract, so shipping one
    # side while the other is broken is worse than not shipping at all.
    needs: [backend, frontend]
    # Deploy on a push to main, or on a manual run — but only ever from main, so a
    # manually dispatched run on a feature branch cannot ship it.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Pinned to master because that is what Fly documents; there is no stable
      # release tag. Worth revisiting — an unpinned action is a supply-chain risk.
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: backend
        # --remote-only builds on Fly's builders, so no Docker is needed here.
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    needs: [backend, frontend]
    # Deploy on a push to main, or on a manual run — but only ever from main, so a
    # manually dispatched run on a feature branch cannot ship it.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    # Scoped to this job rather than raised globally: only the deployment needs to
    # write Pages or mint an OIDC token, and the check jobs should not be able to.
    permissions:
      contents: read
      pages: write
      id-token: write

    # Overrides the workflow-level concurrency, which cancels in progress. A
    # cancelled Pages deployment can leave the environment mid-update, so this one
    # queues instead.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Without this the build still succeeds and silently ships a bundle pointing
      # at ws://localhost:9001 — a broken deploy that looks like a green pipeline.
      - name: Verify broker configuration is present
        run: |
          if [ -z "${{ secrets.VITE_MQTT_URL }}" ]; then
            echo "::error::VITE_MQTT_URL is not set. The build would default to localhost."
            exit 1
          fi

      - name: Build
        working-directory: frontend
        # Vite inlines these at build time. They end up in the public bundle by
        # design — see docs/SECURITY.md; the web-client credential is deliberately
        # near-powerless. They are stored as secrets to keep the cluster URL out of
        # the repository, not because the values stay private.
        env:
          VITE_MESSAGING_BACKEND: mqtt
          VITE_MQTT_URL: ${{ secrets.VITE_MQTT_URL }}
          VITE_MQTT_USERNAME: ${{ secrets.VITE_MQTT_USERNAME }}
          VITE_MQTT_PASSWORD: ${{ secrets.VITE_MQTT_PASSWORD }}
        run: npm run build

      # enablement: true turns Pages on via the API if it is not already enabled,
      # instead of failing with "Get Pages site failed" and requiring someone to
      # click through repository settings first. It makes the pipeline
      # self-provisioning, so a fresh clone of this repo deploys without manual setup.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
